
name: Build DRAGON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          unzip -q DRAGON_AI_Android_Starter_GitHub.zip -d extracted
          gradle -p extracted/DRAGON_AI_Android_Starter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DRAGON-APK
          path: extracted/DRAGON_AI_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
