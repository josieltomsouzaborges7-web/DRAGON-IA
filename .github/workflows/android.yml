
name: Build DRAGON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q DRAGON_AI_Android_Starter.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/DRAGON_AI_Android_Starter assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-APK
          path: extracted/DRAGON_AI_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
